# .github/workflows/deploy.yml
name: Deploy Music Lambda

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: default GITHUB_TOKEN is too broad; this workflow only needs to read the repo.
permissions:
  contents: read

# Serialize prod deploys so out-of-order pushes can't overwrite a newer Lambda with an older build.
concurrency:
  # A PR check and a prod deploy are not the same thing and must not share a queue.
  # They did until 2026-08-02. Only ONE run may sit *pending* in a concurrency group,
  # so a PR run that queued while a deploy was in flight was cancelled before it ran a
  # single job — and a cancelled run reports **no check at all** on the PR, not a red
  # one. A missing gate reads like "nothing to wait for", which is the dangerous shape:
  # the merge rule requires green CI, and absent CI can be mistaken for satisfied CI.
  # (Observed on front #333; the PR run died with zero jobs at 08:02:21Z behind the
  # deploy of the preceding merge. Rare until now — it needs a deploy in flight at the
  # moment a PR queues — but concurrent sessions make that ordinary.)
  #
  # Prod deploys stay serialized under the single group they always had.
  # PR runs get one group per PR and supersede themselves, so a fixup push cancels the
  # older run of the SAME PR (wanted) and nothing else (the bug).
  group: ${{ github.event_name == 'pull_request' && format('music-pr-{0}', github.event.number) || 'music-deploy-prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt pyright

      - name: Type check (pyright)
        run: pyright app/

      - name: Run unit tests
        run: pytest -m "not integration"

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify openapi.json is up to date
        env:
          DATABASE_URL: "postgresql+psycopg://x:x@localhost/x"
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.json

  # Real-DB suite against the Neon test branch (synced to prod schema 2026-07-29).
  # Split from `test` because it needs a live DB. Mirrors the backend job.
  #
  # A skip is treated as a FAILURE: this suite reported green while fully skipped
  # for months, which is the pattern that let two isrc write-path defects reach
  # prod. `recall_gate` is deselected — it is a measurement harness that reports
  # Hit@5 against whatever catalog it is pointed at, not a pass/fail gate, and on
  # the test branch it measures missing data rather than lost recall (pytest.ini).
  integration:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.8.1
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: us-east-1
          EAGER_SERVICE_LOADING: "1"
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health || exit 1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run integration suite
        env:
          TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          DATABASE_URL: "postgresql+psycopg://x:x@localhost/x"
        run: |
          if [ -z "$TEST_DB_URL" ]; then
            echo "::error::TEST_DB_URL secret is not set on this repo — the integration suite would self-skip and report a false green."
            exit 1
          fi
          # The secret must be a full SQLAlchemy URL, not the Neon password on its
          # own (the console shows the two side by side, and pasting the password
          # yields an opaque "Could not parse SQLAlchemy URL"). Never echo the
          # value, a slice of it, or its length: a wrong secret is usually wrong by
          # BEING a raw credential.
          case "$TEST_DB_URL" in
            postgresql://*|postgresql+*://*) ;;
            *)
              echo "::error::TEST_DB_URL is set but does not start with postgresql:// — it looks like the Neon password pasted on its own. Set the full connection string: postgresql+psycopg://USER:PASSWORD@HOST/neondb?sslmode=require"
              exit 1
              ;;
          esac
          # pipefail is NOT on by default in Actions' `bash -e` — without it the
          # pipeline exits with tee's status and a failing pytest reads as green.
          set -o pipefail
          pytest tests/integration -m "integration and not recall_gate" -rs | tee /tmp/integration.txt

      - name: Fail on DB-reason skips
        run: |
          if grep -E '^SKIPPED' /tmp/integration.txt | grep -qiE 'TEST_DB_URL|test branch|not deployed|schema'; then
            echo "::error::a suite skipped for a DB/schema reason — treat as failure, not green:"
            grep -E '^SKIPPED' /tmp/integration.txt
            exit 1
          fi
          echo "No DB-reason skips."

  deploy:
    needs: [test, contract]
    # Production deploy is main-only. `on.push.branches` already filters to main
    # today, but the guard is stated explicitly because this job now carries
    # `id-token: write`: if `workflow_dispatch` is ever added here — the manual
    # recovery path backend and worker both have — a dispatch from a feature branch
    # would otherwise reach this job with an OIDC token in hand. AWS would still
    # refuse (the role's `sub` pins refs/heads/main), but the STS trust condition
    # should not be the only thing standing there. Twin of
    # myblog_backend/.github/workflows/deploy.yml and myblog_worker's.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level block, so `contents: read`
    # is restated here rather than inherited. `id-token: write` is what lets this
    # job mint the OIDC token it trades for the AWS role, and it is granted to this
    # job ONLY — the test/check jobs run on every pull request and must not be able
    # to request one.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Build zip
        run: |
          mkdir -p build
          pip install -r requirements.txt -t build --platform manylinux2014_aarch64 --only-binary=:all:
          cp -r app build/
          find build -name "__pycache__" -type d -exec rm -rf {} +
          find build -name "*.pyc" -delete
          cd build && zip -r ../bundle.zip . && cd -
          ls -lh bundle.zip

      # SEC-system-hardening Step 3c: OIDC, not a long-lived key. The role's trust
      # policy pins `sub` AND `job_workflow_ref` with StringEquals, so only this
      # workflow file on this repo's main can assume it — `sub` alone would also
      # match a pull_request_target run, whose GITHUB_REF is the base branch. The
      # role can call exactly the Lambda actions below on ONE function; the shared
      # github-actions-deploy user it replaces could write four.
      #
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY remain set and are now unused;
      # they are deleted only after this lane is confirmed green in production.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-music-deploy-${{ github.run_id }}
          aws-region: ap-northeast-2

      - name: Deploy to Lambda
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME:-musicApi}" \
            --zip-file fileb://bundle.zip \
            --architectures arm64

      # OPS-delivery-safety-gates Step 3 — post-deploy health smoke (health-only,
      # no credentials). Code is already live here, so this is detect-and-alert-fast
      # + rollback trigger, NOT a pre-cutover gate. A red run means: roll back
      # (re-run the previous green deploy, or re-push the previous bundle).
      # Retries absorb update propagation / cold start.
      - name: Post-deploy smoke (health)
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          URL="https://www.ratemymusic.blog/api/music/search/unified?q=radiohead&type=album&limit=1&_cb=${RUN_ID}"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$URL" | tee /tmp/search.json | grep -q '"albums"'; then
              echo "Music health OK."
              exit 0
            fi
            echo "attempt $i: health not green yet, retrying in 5s…"
            sleep 5
          done
          echo "::error::Music health smoke FAILED — /api/music/search/unified did not return a JSON body with 'albums'. Roll back the deploy."
          exit 1
