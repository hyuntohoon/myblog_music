[pytest]
pythonpath = .
markers =
    integration: requires external services (LocalStack, real DB, Docker)
    recall_gate: search-recall MEASUREMENT harness, not a pass/fail gate — it
        reports Hit@5/Hit@1 against whatever catalog RECALL_GATE_DB_URL points at
        and is expected to fail on a small catalog (the Neon test branch holds
        660 tracks and lacks the prod ids its fixture names, so ~27/30 queries
        are data misses, not recall failures). Excluded from CI; run it by hand
        with RECALL_GATE_DB_URL pointed at the prod catalog, read-only.
